<!-- بخش فرم در index.html -->
<div class="form-group">
    <label>نام یا نام کاربری:</label>
    <input type="text" id="userName" required>
</div>

<div class="form-group">
    <label>روش ارتباطی (ایدی روبیکا، تلگرام، ایمیل یا شماره):</label>
    <input type="text" id="contactInfo" placeholder="مثلاً @user یا 0912..." required>
</div>

<div class="form-group">
    <label>دسته‌بندی مشکل:</label>
    <select id="category">
        <option value="technical">مشکل فنی</option>
        <option value="suggestion">پیشنهاد بازی</option>
        <option value="other">سایر موارد</option>
    </select>
</div>

<div class="form-group">
    <label>متن پیام:</label>
    <textarea id="messageText" rows="4" required></textarea>
</div>

<button onclick="submitSupport()">ارسال درخواست پشتیبانی</button>

<script>
function submitSupport() {
    const data = {
        id: Date.now(),
        name: document.getElementById('userName').value,
        contact: document.getElementById('contactInfo').value,
        category: document.getElementById('category').value,
        message: document.getElementById('messageText').value,
        status: 'pending', // در انتظار
        reply: '', // پاسخ ادمین
        date: new Date().toLocaleString('fa-IR')
    };

    if(!data.name || !data.contact || !data.message) {
        alert("لطفاً تمام فیلدها را پر کنید");
        return;
    }

    let messages = JSON.parse(localStorage.getItem('support_messages') || '[]');
    messages.push(data);
    localStorage.setItem('support_messages', JSON.stringify(messages));
    
    alert("پیام شما با موفقیت ارسال شد. پشتیبانی به زودی با شما در تماس خواهد بود.");
    // خالی کردن فرم
    document.getElementById('userName').value = '';
    document.getElementById('contactInfo').value = '';
    document.getElementById('messageText').value = '';
}
</script>
